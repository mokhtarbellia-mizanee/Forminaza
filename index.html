body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Tahoma,Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,var(--h1),var(--h2),var(--h3,var(--h2)));color:#fff;padding:12px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

nav button.on{background:#fff;color:var(--h1);font-weight:700}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.k{font-size:12.5px;color:var(--mu)}.v{font-size:22px;font-weight:700}.big{font-size:30px;font-weight:700;line-height:1.2}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

input:focus,select:focus,textarea:focus{border-color:var(--pr)}
button.b{background:var(--pr);color:var(--onpr);border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:600}
button.b:active{transform:scale(.97)}
button.g{background:transparent;color:var(--er);border:1.5px solid var(--bd);border-radius:10px;padding:4px 10px;cursor:pointer;font:inherit}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
tr:hover td{background:var(--soft)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--soft);font-weight:600}
.tag.ok{background:rgba(61,154,108,.15)}.tag.wr{background:rgba(191,134,42,.18)}.tag.er{background:rgba(203,95,85,.15)}
.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px}
.hr{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.two .card{margin:0}
.tr{display:grid;grid-template-columns:minmax(70px,1fr) 80px auto;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.ins{background:var(--soft);border-radius:12px;padding:6px 12px;margin-top:8px;font-size:13px}
.chat{max-height:340px;overflow:auto;margin-bottom:10px}
.m{padding:10px 14px;border-radius:16px;margin:6px 0;max-width:85%;white-space:pre-line}
.u{background:var(--pr);color:var(--onpr);margin-inline-start:auto}.a{background:var(--soft)}
.chips button{background:var(--soft);color:var(--pr);border:0;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}
.empty{color:var(--mu);padding:8px}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}details p{margin:6px 0 2px;color:var(--mu)}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--tx);padding:20px;width:min(90vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,20,.5)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
.sheet{background:#fff;color:#111;max-width:800px;margin:8px auto 24px;padding:26px;border-radius:14px;box-shadow:var(--sh);line-height:1.9}
.sheet th,.sheet td{border:1px solid #ddd;color:#111}.sheet tr:hover td{background:none}
.tb{position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--bg);justify-content:center;z-index:2}
.sg{display:flex;justify-content:space-between;margin-top:54px}

fr:[["Démarrage rapide","1) Réglages : choisissez marché, langue, devise et saisissez votre entreprise. 2) Stock : ajoutez vos produits. 3) Factures : choisissez client et produits, puis enregistrez. 4) Suivez vos chiffres sur l'accueil."],["Stock","Ajoutez un produit avec prix d'achat, prix de vente et seuil d'alerte. Une alerte apparaît quand la quantité baisse, et chaque facture déduit le stock."],["Factures et créances","Saisissez le téléphone du client avec l'indicatif pays pour envoyer facture ou relance par WhatsApp. Passez la facture en « Payée » à l'encaissement ; les impayés apparaissent dans une liste dédiée."],["Documents prêts","Tapez un titre (devis, contrat de travail…), le nom de l'autre partie et le montant : le document est prêt à imprimer, télécharger ou partager."],["Impression et PDF","Cliquez sur Imprimer puis choisissez « Enregistrer au format PDF ». Sur téléphone, si l'impression ne marche pas, utilisez Partager."],["Sauvegarde et autres appareils","Dans Réglages, exportez un fichier et importez-le sur un autre appareil, ou utilisez la synchronisation cloud (Push puis Pull). Vos données restent sur votre appareil sauf si vous activez la synchronisation."],["Installation","iPhone : ouvrez le lien dans Safari, Partager → Sur l'écran d'accueil. Android : menu → Installer l'application. Ordinateur : fichier d'installation."]],
en:[["Quick start","1) Settings: choose market, language and currency, then enter your business details. 2) Stock: add your products. 3) Invoices: pick client and products, then save. 4) Follow your numbers on Home."],["Stock","Add a product with cost price, sell price and alert level. You get a warning when stock runs low, and each invoice deducts stock automatically."],["Invoices and debts","Enter the client's phone with country code to send the invoice or a reminder by WhatsApp. Mark an invoice as Paid when collected; unpaid ones appear in a dedicated list."],["Ready-made documents","Type a title (quotation, employment contract…), the other party's name and the amount: the document is ready to print, download or share."],["Printing and PDF","Press Print, then choose “Save as PDF”. On a phone, if printing does not work, use Share."],["Backup and other devices","In Settings, export a file and import it on another device, or use cloud sync (Push then Pull). Your data stays on your device unless you turn sync on."],["Installing","iPhone: open the link in Safari, Share → Add to Home Screen. Android: menu → Install app. Computer: use the installer file."]],
de:[["Schnellstart","1) Einstellungen: Markt, Sprache und Währung wählen, Firmendaten eintragen. 2) Lager: Produkte anlegen. 3) Rechnungen: Kunde und Produkte wählen, speichern. 4) Zahlen auf der Startseite verfolgen."],["Lager","Produkt mit Einkaufspreis, Verkaufspreis und Warnschwelle anlegen. Bei niedrigem Bestand erscheint ein Hinweis, jede Rechnung bucht den Bestand ab."],["Rechnungen und Forderungen","Telefonnummer des Kunden mit Ländervorwahl eintragen, um Rechnung oder Erinnerung per WhatsApp zu senden. Bezahlte Rechnungen als „Bezahlt“ markieren; offene stehen in einer eigenen Liste."],["Fertige Dokumente","Titel eingeben (Angebot, Arbeitsvertrag …), Name der anderen Partei und Betrag: das Dokument ist bereit zum Drucken, Herunterladen oder Teilen."],["Drucken und PDF","Auf Drucken tippen und „Als PDF speichern“ wählen. Funktioniert das Drucken auf dem Handy nicht, nutzen Sie Teilen."],["Sicherung und andere Geräte","In den Einstellungen eine Datei exportieren und auf einem anderen Gerät importieren oder die Cloud-Synchronisation nutzen (Push, dann Pull). Ihre Daten bleiben auf Ihrem Gerät, solange Sie die Synchronisation nicht aktivieren."],["Installation","iPhone: Link in Safari öffnen, Teilen → Zum Home-Bildschirm. Android: Menü → App installieren. Computer: Installationsdatei."]],
es:[["Inicio rápido","1) Ajustes: elija mercado, idioma y moneda e introduzca los datos de su empresa. 2) Inventario: añada sus productos. 3) Facturas: elija cliente y productos y guarde. 4) Siga sus cifras en Inicio."],["Inventario","Añada un producto con precio de compra, precio de venta y nivel de alerta. Se avisa cuando queda poco y cada factura descuenta el stock."],["Facturas y deudas","Introduzca el teléfono del cliente con prefijo de país para enviar la factura o un recordatorio por WhatsApp. Marque la factura como Pagada al cobrar; las pendientes aparecen en una lista aparte."],["Documentos listos","Escriba un título (presupuesto, contrato de trabajo…), el nombre de la otra parte y el importe: el documento queda listo para imprimir, descargar o compartir."],["Impresión y PDF","Pulse Imprimir y elija «Guardar como PDF». En el móvil, si no funciona la impresión, use Compartir."],["Copia y otros dispositivos","En Ajustes exporte un archivo e impórtelo en otro dispositivo, o use la sincronización en la nube (Push y luego Pull). Sus datos se quedan en su dispositivo salvo que active la sincronización."],["Instalación","iPhone: abra el enlace en Safari, Compartir → Añadir a pantalla de inicio. Android: menú → Instalar aplicación. Ordenador: archivo de instalación."]],
it:[["Avvio rapido","1) Impostazioni: scegli mercato, lingua e valuta e inserisci i dati dell'azienda. 2) Magazzino: aggiungi i prodotti. 3) Fatture: scegli cliente e prodotti e salva. 4) Segui i numeri nella Home."],["Magazzino","Aggiungi un prodotto con prezzo d'acquisto, prezzo di vendita e soglia di allerta. Ricevi un avviso quando le scorte calano e ogni fattura scala il magazzino."],["Fatture e crediti","Inserisci il telefono del cliente con prefisso internazionale per inviare fattura o sollecito su WhatsApp. Segna la fattura come Pagata all'incasso; quelle non pagate compaiono in un elenco dedicato."],["Documenti pronti","Scrivi un titolo (preventivo, contratto di lavoro…), il nome dell'altra parte e l'importo: il documento è pronto da stampare, scaricare o condividere."],["Stampa e PDF","Premi Stampa e scegli «Salva come PDF». Sul telefono, se la stampa non funziona, usa Condividi."],["Backup e altri dispositivi","Nelle Impostazioni esporta un file e importalo su un altro dispositivo, oppure usa la sincronizzazione cloud (Push poi Pull). I dati restano sul tuo dispositivo salvo attivazione della sincronizzazione."],["Installazione","iPhone: apri il link in Safari, Condividi → Aggiungi alla schermata Home. Android: menu → Installa app. Computer: file di installazione."]]};
function help(){return `<div class="card">${HELP[S.lang].map((x,k)=>`<details ${k==0?"open":""}><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}</div>${SUPPORT?`<div class="card">💬 ${t("supl")}: <b>${esc(SUPPORT)}</b></div>`:""}`}
function dash(){const C=S.invoices.map(calc),sales=C.reduce((a,c)=>a+c.ttc,0),paid=S.invoices.reduce((a,i,k)=>a+(i.paid?C[k].ttc:0),0),pf=C.reduce((a,c)=>a+c.profit,0),low=S.products.filter(p=>p.q<=p.min),pct=sales?Math.round(paid/sales*100):0;
const R=44,Cc=2*Math.PI*R,donut=`<svg viewBox="0 0 110 110" width="116" height="116"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--bd)" stroke-width="11"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--pr)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${Cc*pct/100} ${Cc}" transform="rotate(-90 55 55)"/><text x="55" y="60" text-anchor="middle" font-size="21" font-weight="700" fill="var(--tx)">${pct}%</text></svg>`;
const now=new Date(),ms=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({y:d.getFullYear(),m:d.getMonth(),v:0,l:d.toLocaleDateString(lc(),{month:"short"})})}
S.invoices.forEach((i,k)=>{const d=new Date(i.iso||Date.now()),m=ms.find(x=>x.y==d.getFullYear()&&x.m==d.getMonth());if(m)m.v+=C[k].ttc});
const mx=Math.max(...ms.map(m=>m.v),1),bars=`<div dir="ltr"><svg viewBox="0 0 300 108" width="100%">${ms.map((m,k)=>{const h=Math.round(m.v/mx*68);return `<rect x="${k*50+10}" y="${80-h}" width="30" height="${Math.max(h,3)}" rx="7" fill="${k==5?"var(--pr)":"var(--soft2)"}"/><text x="${k*50+25}" y="99" text-anchor="middle" font-size="10" fill="var(--mu)">${esc(m.l)}</text>`}).join("")}</svg></div>`;
const tp={};S.invoices.forEach(i=>i.lines.forEach(l=>tp[l.n]=(tp[l.n]||0)+l.q*l.p));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=top[0]?top[0][1]:1;
const ins=[];if(sales)ins.push(t("ins1").replace("{p}",pct));if(top[0])ins.push(t("ins2").replace("{n}",top[0][0]));if(low.length)ins.push(t("ins3").replace("{k}",low.length));
const al=low.map(p=>`<div class="er">• ${esc(p.n)}: ${p.q}</div>`).join("")+debts().map(d=>`<div class="wr">• ${esc(d.c)}: ${f(d.a)}</div>`).join("")+S.projects.filter(p=>p.sp>p.b*.9).map(p=>`<div class="wr">• ${esc(p.n)} ≥ 90%</div>`).join("");
return `<div class="card"><div class="hr">${donut}<div><div class="k">${t("sales")}</div><div class="big">${f(sales)}</div><div class="k">${t("profit")}: <b class="ok">${f(pf)}</b> &nbsp; ${t("unpaid")}: <b class="wr">${f(sales-paid)}</b></div></div></div>${ins.map(x=>`<div class="ins">💡 ${esc(x)}</div>`).join("")}</div>
<div class="two"><div class="card"><h2>${t("m6")}</h2>${bars}</div><div class="card"><h2>${t("topp")}</h2>${top.map(([n,v])=>`<div class="tr"><span>${esc(n)}</span><div class="bar"><i style="width:${Math.round(v/tm*100)}%"></i></div><b>${f(v)}</b></div>`).join("")||`<div class="empty">${t("none")}</div>`}</div></div>
<div class="card" style="margin-top:12px"><h2>⚠️ ${t("alerts")}</h2>${al||`<div class="empty">${t("noal")}</div>`}</div>${S.projects.length?`<div class="card">${S.projects.map(p=>{const r=Math.min(100,Math.round(p.sp/p.b*100)||0);return `<div class="k">${esc(p.n)} — ${r}%</div><div class="bar"><i style="width:${r}%"></i></div><br>`}).join("")}</div>`:""}`}
const PALS=[["sky","#3b6ea5"],["sage","#4f8a62"],["sand","#a2703a"],["slate","#4a5568"],["teal","#3a7f86"],["indigo","#6366f1"],["plum","#6b4aa8"]],PL={ar:"الألوان",fr:"Couleurs",en:"Colors",de:"Farben",es:"Colores",it:"Colori"};
function setPal(p){S.pal=p;save();document.documentElement.dataset.pal=p;render()}
let tab=(location.hash||"#dash").slice(1);if(!TABS.includes(tab))tab="dash";
let S={pal:"sky",lang:"en",reg:"US",cur:"USD",seq:0,sy:{u:"",k:"",c:""},co:{n:"",a:"",p:"",nif:"",nis:"",rc:"",art:"",cc:"",tva:0},products:[],invoices:[],projects:[],docs:[]};
try{const r=JSON.parse(localStorage.getItem("mnsa2")||"null");if(r)S=Object.assign(S,r,{co:Object.assign(S.co,r.co)});else{const n=(navigator.language||"en-US").toLowerCase();S.lang=["ar","fr","de","es","it"].find(x=>n.startsWith(x))||"en";S.reg=n.startsWith("ar")||n.endsWith("-dz")?"DZ":(n=="en"||n.startsWith("en-us")||n.endsWith("-ca")||n.endsWith("-au"))?"US":"EU";const P=REG[S.reg];S.cur=P.cur;S.co.tva=P.tva}}catch(e){}
let draft={client:"",cid:"",phone:"",disc:0,tva:S.co.tva,st:0,lines:[]},chat=[];
const save=()=>{try{localStorage.setItem("mnsa2",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),id=()=>Date.now()+Math.floor(Math.random()*999);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const taxl=()=>TX[S.lang]&&S.reg!="DZ"?TX[S.lang][S.reg=="US"?0:1]:S.reg=="US"?({ar:"ضريبة المبيعات %",fr:"Taxe de vente %",en:"Sales tax %"})[S.lang]:S.reg=="EU"?(S.lang=="fr"?"TVA %":"VAT %"):t("tvan");
const t=k=>(T[S.lang]||T.ar)[k]||k,dir=()=>S.lang=="ar"?"rtl":"ltr";
const lc=()=>({ar:"ar-DZ-u-nu-latn",fr:"fr-FR",de:"de-DE",es:"es-ES",it:"it-IT",en:S.reg=="EU"?"en-GB":"en-US"})[S.lang];
const f=n=>Number(n||0).toLocaleString(lc(),{maximumFractionDigits:2})+" "+CUR[S.cur][S.lang=="ar"?1:0];
const val=i=>$("#"+i).value,num=i=>+val(i)||0,today=()=>new Date().toLocaleDateString(lc());
const calc=i=>{const sub=i.lines.reduce((s,l)=>s+l.q*l.p,0),net=sub*(1-(i.disc||0)/100),tv=net*(i.tva||0)/100;return{sub,net,tv,ttc:net+tv+(i.st||0),profit:net-i.lines.reduce((s,l)=>s+l.q*l.c,0)}};
function applyPg(){let e=$("#pg");if(!e){e=document.createElement("style");e.id="pg";document.head.appendChild(e)}e.textContent="@page{size:"+REG[S.reg].paper+";margin:14mm}"}
function setReg(v){S.reg=v;const P=REG[v];S.cur=P.cur;S.co.tva=P.tva;draft.tva=P.tva;save();setLang(S.lang)}
function setLang(l){S.lang=l;save();applyPg();document.documentElement.dataset.pal=S.pal||"sky";document.documentElement.lang=l;document.documentElement.dir=dir();$("#lg").value=l;$("#ttl").textContent="📊 "+t("app");render()}
function go(x){tab=x;location.hash=x;render()}
function render(){$("#nav").innerHTML=TABS.map(x=>`<button class="${x==tab?"on":""}" onclick="go('${x}')">${t(x)}</button>`).join("");$("#app").innerHTML=({dash,prod,inv,proj,docs,ai,help,set})[tab]()}
function askNum(q,cb){const d=document.createElement("dialog");d.innerHTML=`<h2>${q}</h2><div class="row"><input id="dn" type="number" autofocus><button class="b" id="dok">${t("okb")}</button><button class="g" id="dcl">${t("cancel")}</button></div>`;document.body.appendChild(d);d.showModal();d.querySelector("#dok").onclick=()=>{const n=+d.querySelector("#dn").value;d.remove();cb(n)};d.querySelector("#dcl").onclick=()=>d.remove()}
const debts=()=>{const m={};S.invoices.filter(i=>!i.paid).forEach(i=>{const k=i.client;m[k]=m[k]||{c:k,p:i.phone,a:0};m[k].a+=calc(i).ttc;if(i.phone)m[k].p=i.phone});return Object.values(m)};
function prod(){return `<div class="card"><div class="row"><input id="pn" placeholder="${t("name")}"><input id="pq" type="number" placeholder="${t("qty")}"><input id="pc" type="number" placeholder="${t("buy")}"><input id="pp" type="number" placeholder="${t("sell")}"><input id="pm" type="number" placeholder="${t("min")}"><button class="b" onclick="addP()">${t("add")}</button></div></div><div class="card t"><table><tr><th>${t("name")}</th><th>${t("qty")}</th><th>${t("buy")}</th><th>${t("sell")}</th><th></th><th></th></tr>${S.products.map(p=>`<tr><td>${esc(p.n)}</td><td>${p.q}</td><td>${f(p.c)}</td><td>${f(p.p)}</td><td><span class="tag ${p.q<=p.min?"er":"ok"}">${p.q<=p.min?t("short"):t("ok")}</span></td><td><button class="g" onclick="stock(${p.id})">${t("restock")}</button> <button class="g" onclick="delP(${p.id})">${t("del")}</button></td></tr>`).join("")}</table>${S.products.length?"":`<div class="empty">${t("none")}</div>`}</div>`}
function addP(){if(!val("pn").trim())return;S.products.push({id:id(),n:val("pn").trim(),q:num("pq"),c:num("pc"),p:num("pp"),min:num("pm")||5});save();render()}
function delP(i){S.products=S.products.filter(p=>p.id!=i);save();render()}
function stock(i){askNum(t("aq"),n=>{if(n>0){S.products.find(p=>p.id==i).q+=n;save();render()}})}
function inv(){const D=debts(),c=calc(draft);return `<div class="card"><div class="row"><input placeholder="${t("client")}" value="${esc(draft.client)}" oninput="draft.client=this.value"><input placeholder="${t("phone")}" value="${esc(draft.phone)}" oninput="draft.phone=this.value"><input placeholder="${CID[S.lang]}" value="${esc(draft.cid)}" oninput="draft.cid=this.value"><input placeholder="Country (US, DE…)" maxlength="2" value="${esc(draft.bcc||"")}" oninput="draft.bcc=this.value"></div><div class="row"><select id="is">${S.products.map(p=>`<option value="${p.id}">${esc(p.n)} (${p.q})</option>`).join("")}</select><input id="iq" type="number" value="1" min="1"><button class="b" onclick="addL()">${t("addline")}</button></div>${draft.lines.map((l,k)=>`<div>${esc(l.n)} × ${l.q} = ${f(l.q*l.p)} <button class="g" onclick="draft.lines.splice(${k},1);render()">×</button></div>`).join("")}<div class="row" style="margin-top:10px"><input type="number" placeholder="${t("disc")}" value="${draft.disc||""}" oninput="draft.disc=+this.value"><input type="number" placeholder="${taxl()}" value="${draft.tva}" oninput="draft.tva=+this.value"><input type="number" placeholder="${t("stamp")}" value="${draft.st||""}" oninput="draft.st=+this.value"></div><div class="row"><b>${t("ttc")}: ${f(c.ttc)}</b><button class="b" onclick="saveI()">${t("save")}</button></div></div>
${D.length?`<div class="card"><h2>💸 ${t("debts")}</h2>${D.map((d,k)=>`<div class="row" style="justify-content:space-between;align-items:center"><span>${esc(d.c)} — <b class="wr">${f(d.a)}</b></span>${d.p?`<button class="b" onclick="rem(${k})">💬 ${t("remind")}</button>`:""}</div>`).join("")}</div>`:""}
<div class="card t"><table><tr><th>#</th><th>${t("client")}</th><th>${t("date")}</th><th>${t("total")}</th><th></th><th></th></tr>${S.invoices.map(i=>`<tr><td>${i.no}</td><td>${esc(i.client)}</td><td>${i.d}</td><td>${f(calc(i).ttc)}</td><td><span class="tag ${i.paid?"ok":"wr"}">${i.paid?t("paidS"):t("unpS")}</span></td><td><button class="g" style="color:var(--pr)" onclick="pay(${i.id})">${t("toggle")}</button> <button class="g" style="color:var(--pr)" onclick="viewInv(${i.id})">${t("view")}</button></td></tr>`).join("")}</table>${S.invoices.length?"":`<div class="empty">${t("none")}</div>`}</div>`}
function addL(){const p=S.products.find(x=>x.id==val("is")),q=num("iq");if(!p||q<1)return;if(q>p.q)return alert(t("nostock"));draft.lines.push({pid:p.id,n:p.n,q,p:p.p,c:p.c});render()}
function saveI(){if(!draft.lines.length)return alert(t("need"));draft.lines.forEach(l=>{const p=S.products.find(x=>x.id==l.pid);if(p)p.q=Math.max(0,p.q-l.q)});S.seq++;S.invoices.unshift({id:id(),no:"F-"+new Date().getFullYear()+"-"+String(S.seq).padStart(3,"0"),client:draft.client||"—",phone:draft.phone,cid:draft.cid,bcc:draft.bcc,iso:new Date().toISOString().slice(0,10),d:today(),lines:draft.lines,disc:draft.disc,tva:draft.tva,st:draft.st,paid:false});draft={client:"",cid:"",phone:"",disc:0,tva:S.co.tva,st:0,lines:[]};save();render()}
function pay(i){const v=S.invoices.find(x=>x.id==i);v.paid=!v.paid;save();render()}
const ph=p=>String(p||"").replace(/\D/g,"");
function rem(k){const d=debts()[k];window.open("https://wa.me/"+ph(d.p)+"?text="+encodeURIComponent(t("rem").replace("{c}",d.c).replace("{a}",f(d.a)).replace("{s}",S.co.n||"")),"_blank")}
const hd=()=>{const c=S.co;return `<div style="border-bottom:2px solid #6366f1;padding-bottom:8px;margin-bottom:14px"><b style="font-size:20px">${esc(c.n||"—")}</b><div>${esc(c.a)} ${esc(c.p)}</div><div style="font-size:13px">${REG[S.reg].ids.map((k,j)=>[k,[c.nif,c.nis,c.rc,c.art][j]]).filter(x=>x[1]).map(x=>x[0]+": "+esc(x[1])).join(" • ")}</div></div>`};
const sg=()=>`<div class="sg"><div>${t("s1")}</div><div>${t("s2")}</div></div>`;
function show(h,ti,p,iv){let o=$("#ov");if(!o){o=document.createElement("div");o.id="ov";o.className="ov";document.body.appendChild(o)}
o.innerHTML=`<div class="tb"><button class="b" onclick="window.print()">🖨️ ${t("print")}</button><button class="b" onclick="word()">📄 ${t("word")}</button>${iv?`<button class="b" onclick="ublD(${iv})">🧾 UBL XML</button>`:""}<button class="b" onclick="shr()">📤 ${t("share")}</button>${p?`<button class="b" onclick="wa('${ph(p)}')">💬 ${t("wa")}</button>`:""}<button class="g" onclick="$('#ov').remove()">✖ ${t("close")}</button></div><div class="sheet" id="sh" dir="${dir()}">${h}</div>`;o.dataset.t=ti;o.scrollTop=0}
const dl=(b,n)=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()};
function word(){const ti=$("#ov").dataset.t;dl(new Blob([`<html dir="${dir()}"><head><meta charset="utf-8"></head><body>${$("#sh").innerHTML}</body></html>`],{type:"application/msword"}),ti+".doc")}
function shr(){const x=$("#sh").innerText,ti=$("#ov").dataset.t;if(navigator.share)navigator.share({title:ti,text:x}).catch(()=>{});else{try{navigator.clipboard.writeText(x)}catch(e){}}}
function wa(p){window.open("https://wa.me/"+p+"?text="+encodeURIComponent($("#sh").innerText),"_blank")}
function viewInv(i0){const i=S.invoices.find(x=>x.id==i0),c=calc(i);show(`${hd()}<h2>${t("invno")} ${i.no}</h2><div>${t("date")}: ${i.d}<br>${t("client")}: <b>${esc(i.client)}</b> ${esc(i.phone||"")}${i.cid?`<br>${CID[S.lang]}: ${esc(i.cid)}`:""}</div><br><div class="t"><table><tr><th>#</th><th>${t("name")}</th><th>${t("qty")}</th><th>${t("sell")}</th><th>${t("total")}</th></tr>${i.lines.map((l,k)=>`<tr><td>${k+1}</td><td>${esc(l.n)}</td><td>${l.q}</td><td>${f(l.p)}</td><td>${f(l.q*l.p)}</td></tr>`).join("")}</table></div><br><div>${t("ht")}: ${f(c.sub)}<br>${i.disc?t("disc")+": "+i.disc+"%<br>":""}${taxl()} ${i.tva||0}: ${f(c.tv)}<br>${i.st?t("stamp")+": "+f(i.st)+"<br>":""}<b>${t("ttc")}: ${f(c.ttc)}</b></div>${sg()}`,t("invno")+" "+i.no,i.phone,i.id)}
function proj(){return `<div class="card"><div class="row"><input id="jn" placeholder="${t("newp")}"><input id="jb" type="number" placeholder="${t("budget")}"><button class="b" onclick="addJ()">${t("add")}</button></div></div>${S.projects.map(p=>{const r=Math.round(p.sp/p.b*100)||0;return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(p.n)}</b><button class="g" onclick="delJ(${p.id})">${t("del")}</button></div><div class="k">${t("budget")} ${f(p.b)} — ${f(p.sp)} (<span class="${r>100?"er":r>90?"wr":""}">${r}%</span>)</div><div class="bar"><i style="width:${Math.min(100,r)}%"></i></div><div class="k" style="margin-top:8px">${t("prog")} ${p.pg}%</div><input type="range" min="0" max="100" value="${p.pg}" onchange="setPg(${p.id},this.value)" style="width:100%"><button class="b" onclick="spend(${p.id})">${t("exp")}</button></div>`}).join("")||`<div class="empty">${t("none")}</div>`}`}
function addJ(){if(!val("jn").trim())return;S.projects.push({id:id(),n:val("jn").trim(),b:num("jb"),sp:0,pg:0});save();render()}
function delJ(i){S.projects=S.projects.filter(p=>p.id!=i);save();render()}
function spend(i){askNum(t("ae"),n=>{if(n>0){S.projects.find(p=>p.id==i).sp+=n;save();render()}})}
function setPg(i,v){S.projects.find(p=>p.id==i).pg=+v;save();render()}
function docs(){return `<div class="card"><h2>✨ ${t("docs")}</h2><div class="row"><input id="dt" placeholder="${t("dtitle")}"></div><div class="row"><input id="dc" placeholder="${t("party")}"><input id="da" type="number" placeholder="${t("amount")}"></div><button class="b" onclick="genD()">${t("gen")}</button></div><div class="card"><h2>${t("saved")}</h2>${S.docs.map(d=>`<div class="row" style="justify-content:space-between;align-items:center"><span>${esc(d.t)} <span class="k">${d.d}</span></span><span><button class="g" style="color:var(--pr)" onclick="openD(${d.id})">${t("view")}</button> <button class="g" onclick="delD(${d.id})">${t("del")}</button></span></div>`).join("")||`<div class="empty">${t("none")}</div>`}</div>`}
function genD(){const ti=val("dt").trim();if(!ti)return;const lo=ti.toLowerCase(),tp=DT.find(d=>d.kw.some(k=>lo.includes(k.toLowerCase())));const L=S.lang,head=tp?tp.t[L]:ti,a=val("da")?f(+val("da")):"……",m={"{s}":S.co.n||"……","{c}":val("dc")||"……","{a}":a,"{d}":today(),"{t}":ti};
const body=(tp?tp.b[L]:GEN.b[L]).replace(/\{[scadt]\}/g,x=>m[x]).split("\n").map(x=>`<p>${esc(x)}</p>`).join("");
const h=`${hd()}<h2 style="text-align:center">${esc(head)}</h2>${body}${sg()}<p style="font-size:11px;color:#777;margin-top:30px">${t("disc2")}</p>`;
S.docs.unshift({id:id(),t:head+(val("dc")?" - "+val("dc"):""),h,d:today()});save();show(h,head,"")}
function openD(i){const d=S.docs.find(x=>x.id==i);show(d.h,d.t,"")}
function delD(i){S.docs=S.docs.filter(d=>d.id!=i);save();render()}
function set(){const c=S.co,I=(k,p)=>`<input placeholder="${t(p)}" value="${esc(c[k])}" oninput="S.co.${k}=this.value;save()">`;
return `<div class="card"><h2>${t("co")}</h2><div class="row">${I("n","cn")}${I("a","addr")}${I("p","phone")}</div><div class="row">${REG[S.reg].ids.map((k,j)=>k?I(["nif","nis","rc","art"][j],k):"").join("")}${I("cc","Country (US, DE, FR…)")}<input type="number" placeholder="${taxl()}" value="${c.tva}" oninput="S.co.tva=+this.value;draft.tva=+this.value;save()"></div></div>
<div class="card"><h2>🎨 ${PL[S.lang]}</h2><div class="row">${PALS.map(p=>`<button class="pal" title="${p[0]}" onclick="setPal('${p[0]}')" style="background:${p[1]};${S.pal==p[0]?"outline:3px solid var(--tx);outline-offset:2px":""}"></button>`).join("")}</div></div><div class="card"><div class="row"><select onchange="setReg(this.value)"><option value="US" ${S.reg=="US"?"selected":""}>🇺🇸 United States</option><option value="EU" ${S.reg=="EU"?"selected":""}>🇪🇺 Europe / UK</option><option value="DZ" ${S.reg=="DZ"?"selected":""}>🇩🇿 Algérie</option></select><select onchange="setLang(this.value)"><option value="ar" ${S.lang=="ar"?"selected":""}>العربية</option><option value="fr" ${S.lang=="fr"?"selected":""}>Français</option><option value="en" ${S.lang=="en"?"selected":""}>English</option><option value="de" ${S.lang=="de"?"selected":""}>Deutsch</option><option value="es" ${S.lang=="es"?"selected":""}>Español</option><option value="it" ${S.lang=="it"?"selected":""}>Italiano</option></select><select onchange="S.cur=this.value;save();render()">${Object.keys(CUR).map(k=>`<option ${S.cur==k?"selected":""}>${k}</option>`).join("")}</select></div></div>
<div class="card"><h2>☁️ Sync</h2><div class="k">${SYN[S.lang]}</div><div class="row" style="margin-top:8px"><input placeholder="Supabase URL" value="${esc(S.sy.u)}" oninput="S.sy.u=this.value;save()"><input placeholder="Anon key" value="${esc(S.sy.k)}" oninput="S.sy.k=this.value;save()"><input placeholder="Sync code" value="${esc(S.sy.c)}" oninput="S.sy.c=this.value;save()"></div><div class="row"><button class="g" style="color:var(--pr)" onclick="genC()">🎲 Code</button><button class="b" onclick="syncPush()">⬆️ Push</button><button class="b" onclick="syncPull()">⬇️ Pull</button></div></div><div class="card k">🔒 ${PV[S.lang]}</div><div class="card"><h2>${t("bk")}</h2><div class="k">${t("bkn")}</div><div class="row" style="margin-top:10px"><button class="b" onclick="expD()">⬇️ ${t("exp2")}</button><label class="b" style="cursor:pointer">⬆️ ${t("imp")}<input type="file" accept=".json" hidden onchange="impD(event)"></label></div></div><div class="k" style="text-align:center;padding:8px">Manassa v${VER}</div>`}
function expD(){const b=new Blob([JSON.stringify(snap())],{type:"application/json"}),fl=new File([b],"backup.json",{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[fl]}))navigator.share({files:[fl]}).catch(()=>{});else dl(b,"backup.json")}
function impD(e){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;S=Object.assign(S,d);save();setLang(S.lang)}catch(x){alert("✖")}};r.readAsText(e.target.files[0])}
function answer(s){const A=AA[S.lang],C=S.invoices.map(calc),sales=C.reduce((a,c)=>a+c.ttc,0),pf=C.reduce((a,c)=>a+c.profit,0);
if(/ربح|profit|b[ée]n[ée]f|gewinn|beneficio|ganancia|utile|guadagno/i.test(s))return A.p+f(pf);
if(/مخزون|نقص|ينفد|stock|low|lager|bestand|inventario|scorte|magazzino/i.test(s)){const l=S.products.filter(p=>p.q<=p.min);return l.length?A.l+"\n"+l.map(p=>`• ${p.n}: ${p.q}`).join("\n"):A.lo}
if(/دين|ديون|متأخر|مدفوع|impay|dette|debt|unpaid|offen|forderung|schulden|deuda|pendiente|crediti|non pagat/i.test(s)){const d=debts();return d.length?A.u+"\n"+d.map(x=>`• ${x.c}: ${f(x.a)}`).join("\n"):A.uo}
if(/مشروع|ميزانية|projet|project|budget|projekt|proyecto|progetto/i.test(s))return S.projects.length?A.pj+"\n"+S.projects.map(p=>`• ${p.n}: ${Math.round(p.sp/p.b*100)||0}% / ${p.pg}%`).join("\n"):t("none");
if(/مبيعات|vente|sales|umsatz|ventas|vendite/i.test(s))return A.s+f(sales);return A.h}
function ai(){const q={ar:["كم ربحت؟","أي منتج سينفد؟","الديون","المشاريع"],fr:["Bénéfice ?","Stock faible ?","Créances","Projets"],en:["Profit?","Low stock?","Debts","Projects"],de:["Gewinn?","Niedriger Bestand?","Forderungen","Projekte"],es:["¿Beneficio?","¿Stock bajo?","Deudas","Proyectos"],it:["Utile?","Scorte basse?","Crediti","Progetti"]}[S.lang];
return `<div class="card"><div class="chat" id="ch">${chat.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join("")}</div><div class="chips row">${q.map(x=>`<button onclick="ask(this.textContent)">${x}</button>`).join("")}</div><div class="row"><input id="qi" placeholder="${t("qm")}" onkeydown="if(event.key=='Enter')ask()"><button class="b" onclick="ask()">${t("send")}</button></div></div>`}
function ask(x){x=x||val("qi").trim();if(!x)return;chat.push({r:"u",t:x},{r:"a",t:answer(x)});render()}
setLang(S.lang);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
